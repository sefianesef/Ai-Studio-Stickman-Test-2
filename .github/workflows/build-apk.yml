name: Build & Package Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Environment and Keystore Files
        run: |
          echo "=== Setting up environment variables and keys ==="
          # Ensure .env exists so secrets plugin does not fail
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Ensure debug.keystore exists for signingConfig
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Generating clean debug.keystore with keytool..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure Gradle wrapper script has execute permissions
          chmod +x gradlew || true

      - name: Build Android Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Package and Verify APK Outputs
        run: |
          mkdir -p build_outputs
          find app/build/outputs/apk/debug/ -type f -name "*.apk" -exec cp {} build_outputs/StickmanBridgeMaster-Debug.apk \;
          echo "=== Generated Artifacts ==="
          ls -lh build_outputs/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StickmanBridgeMaster-Debug-APK
          path: build_outputs/*.apk
          if-no-files-found: error
          retention-days: 30

