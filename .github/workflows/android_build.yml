name: Build & Release Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (Debug & Release)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Create Secrets and Keystore
        run: |
          echo "=== 1. Setting up Environment Secrets ==="
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          echo "=== 2. Setting up Debug Keystore ==="
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "=== 3. Setting Execution Permissions ==="
          chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            -Dksp.incremental=false \
            -Dksp.use.ksp2=true \
            -Dandroid.disallowKotlinSourceSets=false \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

      - name: Collect Output Artifacts
        run: |
          mkdir -p build_outputs
          find app/build/outputs/apk/debug/ -type f -name "*.apk" -exec cp {} build_outputs/stickman-hero-debug.apk \;
          echo "=== Generated Artifacts List ==="
          ls -lh build_outputs/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stickman-hero-debug-apk
          path: build_outputs/*.apk
          if-no-files-found: error
          retention-days: 14
